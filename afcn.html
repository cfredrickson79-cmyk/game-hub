<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFC North What-If — Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#FFB612; --red:#C60C30; --blue:#00539B;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; --orb:'Orbitron',var(--font);}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font); color:#eef2f8; min-height:100vh; position:relative;
    background:
      radial-gradient(80% 48% at 12% -8%, rgba(255,182,18,.10), transparent 55%),
      radial-gradient(80% 48% at 100% 6%, rgba(198,12,48,.09), transparent 55%),
      linear-gradient(160deg,#0a0c12 0%,#05060a 45%,#010203 100%);}
  body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,0) 24%, rgba(255,255,255,0) 68%, rgba(255,255,255,.035)),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 1px, transparent 1px 10px);}
  .wrap{position:relative; z-index:1}
  .wrap{max-width:860px; margin:0 auto; padding:14px 14px 40px;}
  .mast{display:flex; align-items:center; gap:11px; padding:4px 2px 2px}
  .mast .bars{display:flex; gap:4px}
  .mast .bars i{width:9px;height:24px;border-radius:2px;display:block}
  .mast h1{font:700 1.02rem/1.15 var(--orb); letter-spacing:.04em; margin:0}
  .mast h1 small{display:block; font:600 .62rem/1.4 var(--font); color:#8794ab; letter-spacing:.16em; text-transform:uppercase; margin-top:3px}

  /* ============ GLASS RECIPE (carried from dashboard house style) ============ */
  .glass{position:relative; overflow:hidden; border-radius:14px; border:1px solid rgba(242,242,242,.5);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 1px,rgba(255,255,255,0) 1px 7px),
      linear-gradient(100deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
    box-shadow:0 0 0 .5px rgba(140,140,140,.55), inset 0 1px 0 rgba(255,255,255,.45), 0 6px 18px rgba(0,0,0,.45);}
  .glass::before{content:""; position:absolute; top:-70%; left:-15%; width:135%; height:120%; border-radius:50%;
    transform:rotate(-3deg); background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.04)); pointer-events:none; z-index:0}
  .glass::after{content:""; position:absolute; left:16px; right:16px; bottom:4px; height:2px; border-radius:2px;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5) 35%,rgba(255,255,255,.7) 85%,rgba(255,255,255,.18)); pointer-events:none; z-index:0}
  .glass>*{position:relative; z-index:1}

  /* ============ STANDINGS (sticky) ============ */
  .standings{position:sticky; top:8px; z-index:20; padding:10px 10px 12px; margin:14px 0 18px;
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 7px),
      linear-gradient(180deg, rgba(34,38,50,.9), rgba(6,8,12,.94));
    backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 12px 32px rgba(0,0,0,.62);}
  .standings h2{font:600 .64rem/1 var(--orb); letter-spacing:.18em; text-transform:uppercase; color:#9aa6bc; margin:2px 4px 10px; display:flex; justify-content:space-between}
  .stHead{display:grid; grid-template-columns:26px 1fr 58px 50px 52px 40px; gap:8px; padding:0 10px 7px;
    font:700 .58rem/1 var(--font); letter-spacing:.1em; text-transform:uppercase; color:#7b88a0}
  .stHead .c{text-align:center}
  #rows{position:relative}
  .trow{display:grid; grid-template-columns:26px 1fr 58px 50px 52px 40px; gap:8px; align-items:center;
    padding:11px 11px; margin:9px 0; border-radius:13px; will-change:transform; position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.17);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 7px),
      linear-gradient(110deg, color-mix(in srgb, var(--tc) 40%, rgba(30,34,44,.65)), rgba(14,16,24,.6));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.55), 0 8px 20px rgba(0,0,0,.55), 0 2px 5px rgba(0,0,0,.45);}
  .trow::before{content:""; position:absolute; top:-70%; left:-15%; width:135%; height:120%; border-radius:50%;
    transform:rotate(-3deg); background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.03)); pointer-events:none; z-index:0}
  .trow>*{position:relative; z-index:1}
  .trow.lead{border-color:rgba(255,182,18,.55);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 1px,rgba(255,255,255,0) 1px 7px),
      linear-gradient(110deg, color-mix(in srgb, var(--tc) 46%, rgba(255,182,18,.18)), rgba(16,18,26,.6));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.5), 0 10px 26px rgba(255,182,18,.22), 0 2px 6px rgba(0,0,0,.5)}
  .trow.moved{animation:pop .5s ease}
  @keyframes pop{0%{box-shadow:0 0 0 0 rgba(255,182,18,.5)}100%{box-shadow:0 0 0 12px rgba(255,182,18,0)}}
  .rk{font:900 1rem var(--orb); text-align:center; color:#5d6a85}
  .trow.lead .rk{color:var(--gold); text-shadow:0 0 10px rgba(255,182,18,.6)}
  .teamcell{display:flex; align-items:center; gap:10px; min-width:0}
  .rec{font:800 1.02rem var(--orb); font-variant-numeric:tabular-nums; text-align:center}
  .pct{font:700 .92rem var(--orb); font-variant-numeric:tabular-nums; text-align:center; color:var(--gold)}
  .sub{font:600 .84rem var(--font); font-variant-numeric:tabular-nums; text-align:center; color:#aeb9cd}
  .gb{font:700 .86rem var(--font); text-align:center; color:#9aa6bc}
  @media(max-width:540px){ .stHead,.trow{grid-template-columns:22px 1fr 50px 44px 0 34px} .hideSm{display:none!important} }

  /* logo chip */
  .lg{--bg:#55607a; width:40px;height:40px; flex:0 0 auto; position:relative; display:flex; align-items:center; justify-content:center}
  .lg img{width:100%;height:100%;object-fit:contain; display:block; filter:drop-shadow(0 0 1.5px rgba(255,255,255,.55)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .lg b{display:none; font:800 .62rem/1 var(--font); color:#fff}
  .lg.fb{background:var(--bg); border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.5)} .lg.fb b{display:block} .lg.fb img{display:none}
  @media(max-width:720px){ .lg{width:32px;height:32px} .lg b{font-size:.56rem} }
  @media(max-width:480px){ .lg{width:28px;height:28px} .lg b{font-size:.5rem} }
  .tabbr{font:800 1rem var(--orb); letter-spacing:.03em}
  .teamcell .meta small{display:block; font:600 .62rem var(--font); color:#8794ab; letter-spacing:.04em}

  /* ============ CONTROLS ============ */
  .ctrls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:4px 2px 12px}
  .ctrls .lab{font:600 .64rem/1 var(--orb); letter-spacing:.16em; text-transform:uppercase; color:#8794ab; margin-right:auto}
  .btn{cursor:pointer; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#cfd7e6;
    padding:8px 12px; border-radius:9px; font:600 .78rem var(--font)}
  .btn:hover{border-color:rgba(255,255,255,.3)}

  /* ============ SCHEDULE ============ */
  .wk{margin:16px 0 8px}
  .wk .wkh{display:flex; align-items:center; gap:10px; margin:0 4px 8px}
  .wk .wkh b{font:700 .72rem var(--orb); letter-spacing:.14em; text-transform:uppercase; color:#aab5c9}
  .wk .wkh .ln{flex:1; height:1px; background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)}
  .wk.cur .wkh b{color:var(--gold)}
  .game{display:grid; grid-template-columns:1fr 54px 1fr; align-items:center; gap:8px; padding:11px 12px; margin:11px 0; border-radius:14px;
    border:1px solid rgba(255,255,255,.17);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,rgba(255,255,255,0) 1px 7px),
      linear-gradient(180deg, rgba(64,70,86,.42), rgba(16,18,26,.52));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.6), 0 12px 26px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.5);}
  .game:hover{border-color:rgba(255,255,255,.26)}
  .side{display:flex; align-items:center; gap:9px; cursor:pointer; padding:7px 8px; border-radius:10px; border:1px solid transparent; transition:.14s; min-width:0}
  .side.home{flex-direction:row-reverse; text-align:right}
  .side:hover{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14)}
  .side .nm{font:800 .98rem var(--orb); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .side .rec{font:600 .62rem var(--font); color:#8794ab; text-align:inherit}
  .side.win{background:color-mix(in srgb,var(--tc) 30%, transparent); border-color:color-mix(in srgb,var(--tc) 70%, transparent)}
  .side.win .nm{color:#fff}
  .side.lose{opacity:.42}
  .side.locked{cursor:default}
  .side.locked:hover{background:transparent;border-color:transparent}
  .mid{display:flex; flex-direction:column; align-items:center; gap:2px}
  .mid .at{font:700 .58rem/1.3 var(--orb); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; color:#8794ab}
  .mid .sc{font:700 .58rem var(--font); color:#9aa6bc; white-space:nowrap}
  .mid .lk{font:600 .54rem var(--font); letter-spacing:.1em; text-transform:uppercase; color:#6d7a93}
  .mid .lk.mine{color:var(--gold)} .mid .lk.ok{color:#8ce292} .mid .lk.no{color:#f48c94}
  .ties{font:600 .64rem/1.4 var(--font); color:#aab5c9; margin:8px 6px 0; letter-spacing:.02em}
  .divtag{font:700 .5rem var(--font); letter-spacing:.08em; color:#101820; background:var(--gold); border-radius:999px; padding:1px 5px}

  .legend{font:400 .72rem/1.55 var(--font); color:#8794ab; margin:18px 4px 0}
  .legend b{color:#c3cbd8}
  .wk.cur .mid .at{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="bars"><i style="background:#FFB612"></i><i style="background:#C60C30"></i><i style="background:#00539B"></i></div>
    <h1>AFC North What-If<small>Pick winners · standings move live</small></h1>
  </div>

  <div class="standings glass">
    <h2><span>Standings</span><span id="setcount"></span></h2>
    <div class="stHead"><div class="c">#</div><div>Team</div><div class="c">W-L</div><div class="c">PCT</div><div class="c hideSm">DIV</div><div class="c">GB</div></div>
    <div id="rows"></div>
  </div>

  <div class="ctrls">
    <span class="lab">Scenario</span>
    <button class="btn" id="bClr">Clear my picks</button>
    <button class="btn" id="bRnd">Random rest</button>
    <button class="btn" id="bSnd">Sound: on</button>
  </div>

  <div id="sched"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
/* ---------- Teams ---------- */
const TEAMS={
  PIT:{tc:"#FFB612",fb:"#101820",city:"Pittsburgh"},
  BAL:{tc:"#241773",fb:"#241773",city:"Baltimore"},
  CIN:{tc:"#FB4F14",fb:"#FB4F14",city:"Cincinnati"},
  CLE:{tc:"#FF3C00",fb:"#311D00",city:"Cleveland"}
};
const ORDER=["PIT","BAL","CIN","CLE"];
const OPP={ATL:"#A71930",NE:"#002244",IND:"#002C5F",TB:"#D50A0A",NO:"#D3BC8D",PHI:"#004C54",DEN:"#FB4F14",
  HOU:"#03202F",JAX:"#006778",CAR:"#0085CA",TEN:"#4B92DB",DAL:"#041E42",BUF:"#00338D",LAC:"#0080C6",
  WAS:"#5A1414",KC:"#E31837",MIA:"#008E97",NYJ:"#125740",LV:"#000000",NYG:"#0B2265"};
const TO_ESPN={WAS:"wsh"},FROM_ESPN={WSH:"WAS"};
const espnAbbr=a=>(TO_ESPN[a]||a).toLowerCase();

/* ---------- Schedule: division games [week, home, away] ---------- */
const DIV=[
  [3,"PIT","CIN"],[10,"CIN","PIT"],[4,"CLE","PIT"],[8,"PIT","CLE"],
  [15,"PIT","BAL"],[18,"BAL","PIT"],[6,"CLE","BAL"],[16,"BAL","CLE"],
  [7,"BAL","CIN"],[17,"CIN","BAL"],[13,"CLE","CIN"],[18,"CIN","CLE"]
];
/* Non-division [week, team, opponent, opponent conference, team is home] */
const NOND=[
  [1,"PIT","ATL","NFC",true],[2,"PIT","NE","AFC",false],[5,"PIT","IND","AFC",true],[6,"PIT","TB","NFC",false],
  [7,"PIT","NO","NFC",false],[11,"PIT","PHI","NFC",false],[12,"PIT","DEN","AFC",true],[13,"PIT","HOU","AFC",true],
  [14,"PIT","JAX","AFC",false],[16,"PIT","CAR","NFC",true],[17,"PIT","TEN","AFC",false],
  [1,"BAL","IND","AFC",false],[2,"BAL","NO","NFC",true],[3,"BAL","DAL","NFC",false],[4,"BAL","TEN","AFC",true],
  [5,"BAL","ATL","NFC",false],[8,"BAL","BUF","AFC",false],[9,"BAL","JAX","AFC",true],[10,"BAL","LAC","AFC",true],
  [11,"BAL","CAR","NFC",false],[12,"BAL","HOU","AFC",false],[14,"BAL","TB","NFC",true],
  [1,"CIN","TB","NFC",true],[2,"CIN","HOU","AFC",false],[4,"CIN","JAX","AFC",true],[5,"CIN","MIA","AFC",false],
  [8,"CIN","TEN","AFC",true],[9,"CIN","ATL","NFC",false],[11,"CIN","WAS","NFC",false],[12,"CIN","NO","NFC",true],
  [14,"CIN","KC","AFC",true],[15,"CIN","CAR","NFC",false],[16,"CIN","IND","AFC",false],
  [1,"CLE","JAX","AFC",false],[2,"CLE","TB","NFC",false],[3,"CLE","CAR","NFC",true],[5,"CLE","NYJ","AFC",false],
  [7,"CLE","TEN","AFC",false],[9,"CLE","NO","NFC",false],[10,"CLE","HOU","AFC",true],[12,"CLE","LV","AFC",true],
  [14,"CLE","ATL","NFC",true],[15,"CLE","NYG","NFC",false],[17,"CLE","IND","AFC",true]
];
const GAMES=[];
DIV.forEach((g,i)=>GAMES.push({id:"d"+i,wk:g[0],div:true,home:g[1],away:g[2]}));
NOND.forEach((g,i)=>{const home=g[4]?g[1]:g[2],away=g[4]?g[2]:g[1];
  GAMES.push({id:"n"+i,wk:g[0],div:false,home,away,team:g[1],conf:g[3]});});
const isTeam=x=>!!TEAMS[x];
function gid(wk,a,b){const g=GAMES.find(g=>g.wk===wk&&((g.home===a&&g.away===b)||(g.home===b&&g.away===a)));return g?g.id:null;}

/* ---------- Finals on file (confirmed through Week 3); ESPN refresh adds newer ones ---------- */
const FINAL={};
function fin(wk,a,b,w,sc){const id=gid(wk,a,b);if(id)FINAL[id]={w,sc};}
fin(1,"PIT","ATL","PIT","PIT 20-13 ATL");fin(2,"PIT","NE","NE","NE 20-3 PIT");fin(3,"PIT","CIN","PIT","PIT 30-27 CIN");
fin(1,"BAL","IND","BAL","BAL 41-23 IND");fin(2,"BAL","NO","NO","NO 24-17 BAL");fin(3,"BAL","DAL","BAL","BAL 34-31 DAL");
fin(1,"CIN","TB","CIN","CIN 33-27 TB");fin(2,"CIN","HOU","CIN","CIN 20-6 HOU");
fin(1,"CLE","JAX","JAX","JAX 34-10 CLE");fin(2,"CLE","TB","CLE","CLE 23-19 TB");fin(3,"CLE","CAR","CLE","CLE 21-18 CAR");

/* ---------- Current NFL week (week w ends Monday Sep 14 2026 + 7(w-1)) ---------- */
function currentWeek(){const now=new Date();for(let w=1;w<=18;w++){if(now<=new Date(2026,8,14+7*(w-1),23,59,59))return w;}return 18;}
const CUR_WK=currentWeek();

/* ---------- Picks start fresh on every load (shared family app); clear any picks saved by older versions ---------- */
const KEY="afcnPicks";
let picks={};
try{localStorage.removeItem(KEY);}catch(e){}
function savePicks(){}
let results={};
function merge(){results=Object.assign({},picks);for(const id in FINAL)results[id]=FINAL[id].w;}
function clearPicks(){picks={};savePicks();render(true);}
function randomRest(){GAMES.forEach(g=>{if(!FINAL[g.id])picks[g.id]=Math.random()<0.5?g.home:g.away;});savePicks();pop(true);render(true);}
function pick(id,side){if(FINAL[id])return;const on=picks[id]!==side;if(on)picks[id]=side;else delete picks[id];savePicks();pop(on);render(true);}

/* ---------- Standings engine ---------- */
function compute(){
  const t={};ORDER.forEach(c=>t[c]={code:c,w:0,l:0,dw:0,dl:0,cw:0,cl:0,h2h:{}});
  ORDER.forEach(a=>ORDER.forEach(b=>{if(a!==b)t[a].h2h[b]={w:0,l:0};}));
  GAMES.forEach(g=>{const win=results[g.id];if(!win)return;
    if(g.div){const lose=g.home===win?g.away:g.home;
      t[win].w++;t[win].dw++;t[win].cw++;t[win].h2h[lose].w++;
      t[lose].l++;t[lose].dl++;t[lose].cl++;t[lose].h2h[win].l++;}
    else{const tm=t[g.team];if(win===g.team){tm.w++;if(g.conf==="AFC")tm.cw++;}else{tm.l++;if(g.conf==="AFC")tm.cl++;}}});
  /* no games yet in a category is neutral (.500), never treated like a losing record */
  const pct=(w,l)=>(w+l)?w/(w+l):0.5;
  ORDER.forEach(c=>{const x=t[c];x.pct=(x.w+x.l)?x.w/(x.w+x.l):0;x.dpct=pct(x.dw,x.dl);x.cpct=pct(x.cw,x.cl);});
  const arr=ORDER.map(c=>t[c]);
  arr.sort((a,b)=>{
    if(b.pct!==a.pct)return b.pct-a.pct;
    const h=a.h2h[b.code];if(h.w!==h.l)return h.w>h.l?-1:1;
    if(b.dpct!==a.dpct)return b.dpct-a.dpct;
    if(b.cpct!==a.cpct)return b.cpct-a.cpct;
    return ORDER.indexOf(a.code)-ORDER.indexOf(b.code);});
  const lw=arr[0].w,ll=arr[0].l;
  arr.forEach((x,i)=>{x.gb=((lw-x.w)+(x.l-ll))/2;x.tiedPrev=i>0&&arr[i-1].pct===x.pct;});
  return arr;
}
function decidedBy(a,b){const h=a.h2h[b.code];if(h.w!==h.l)return "head-to-head";
  if(a.dpct!==b.dpct)return "division record";if(a.cpct!==b.cpct)return "conference record";return "coin flip";}

/* ---------- Logos: same ESPN source the hub uses; colored crest if one can't load ---------- */
function logo(side){const T=TEAMS[side],bg=T?T.fb:(OPP[side]||"#55607a");
  return `<span class="lg" style="--bg:${bg}"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/${espnAbbr(side)}.png" alt="${side}" onerror="this.parentNode.classList.add('fb')"><b>${side}</b></span>`;}

/* ---------- Standings: rows slide when the order changes ---------- */
const rowsBox=document.getElementById("rows");
const rowEls={};let stat={};
function buildRows(){
  ORDER.forEach(c=>{const T=TEAMS[c],d=document.createElement("div");
    d.className="trow";d.style.setProperty("--tc",T.tc);
    d.innerHTML=`<div class="rk"></div><div class="teamcell">${logo(c)}<div class="meta"><span class="tabbr">${c}</span><small>${T.city}</small></div></div><div class="rec"></div><div class="pct"></div><div class="sub hideSm"></div><div class="gb"></div>`;
    rowEls[c]=d;rowsBox.appendChild(d);});
  const tl=document.createElement("div");tl.id="ties";tl.className="ties";rowsBox.after(tl);
}
function renderStandings(flip){
  const arr=compute();stat={};arr.forEach(x=>stat[x.code]=x);
  const first={};if(flip)ORDER.forEach(c=>first[c]=rowEls[c].getBoundingClientRect().top);
  arr.forEach((x,i)=>{const el=rowEls[x.code];el.classList.toggle("lead",i===0);
    el.querySelector(".rk").textContent=i+1;
    el.querySelector(".rec").textContent=`${x.w}-${x.l}`;
    el.querySelector(".pct").textContent=x.pct.toFixed(3).replace(/^0/,"");
    el.querySelector(".sub").textContent=`${x.dw}-${x.dl}`;
    el.querySelector(".gb").textContent=x.gb<=0?"—":x.gb.toFixed(x.gb%1?1:0);
    rowsBox.appendChild(el);});
  if(flip)ORDER.forEach(c=>{const el=rowEls[c],dy=first[c]-el.getBoundingClientRect().top;if(!dy)return;
    el.style.transition="none";el.style.transform=`translateY(${dy}px)`;
    requestAnimationFrame(()=>{el.style.transition="transform .42s cubic-bezier(.2,.8,.2,1)";el.style.transform="";});
    el.classList.remove("moved");void el.offsetWidth;el.classList.add("moved");});
  const ties=[];for(let i=1;i<arr.length;i++)if(arr[i].tiedPrev)ties.push(`${arr[i-1].code} over ${arr[i].code}: ${decidedBy(arr[i-1],arr[i])}`);
  document.getElementById("ties").textContent=ties.length?"Tiebreaks · "+ties.join(" · "):"";
  const nf=Object.keys(FINAL).length,np=Object.keys(picks).filter(id=>!FINAL[id]).length;
  document.getElementById("setcount").textContent=`${nf} final · ${np} picked`;
}

/* ---------- Schedule: one card per game, visitor left, home right ---------- */
const schedBox=document.getElementById("sched");const ref={};
function buildSched(){
  [...new Set(GAMES.map(g=>g.wk))].sort((a,b)=>a-b).forEach(wk=>{
    const wd=document.createElement("div");wd.className="wk"+(wk===CUR_WK?" cur":"");wd.id="wk-"+wk;
    wd.innerHTML=`<div class="wkh"><b>Week ${wk}${wk===CUR_WK?" · now":""}</b><span class="ln"></span></div>`;
    GAMES.filter(g=>g.wk===wk).sort((a,b)=>(a.div?0:1)-(b.div?0:1)).forEach(g=>{
      const tc=s=>isTeam(s)?TEAMS[s].tc:(OPP[s]||"#55607a");

        <div class="mid"><div class="at">@</div><div class="sc"></div><div class="lk"></div>${g.div?'<div class="divtag">DIV ★</div>':''}</div>
        <div class="side home" style="--tc:${tc(g.home)}">${logo(g.home)}<div><div class="nm">${g.home}</div><div class="rec" data-rec="${g.home}"></div></div></div>`;

}
function refreshSched(){
  GAMES.forEach(g=>{const r=ref[g.id],win=results[g.id],f=FINAL[g.id],p=picks[g.id];
    r.a.classList.toggle("win",win===g.away);r.a.classList.toggle("lose",!!win&&win!==g.away);
    r.h.classList.toggle("win",win===g.home);r.h.classList.toggle("lose",!!win&&win!==g.home);
    r.a.classList.toggle("locked",!!f);r.h.classList.toggle("locked",!!f);
    r.gm.classList.toggle("picked",!!p&&!f);
    r.at.textContent=whenText(g)||"@";r.sc.textContent=f?f.sc:"";r.lk.className="lk";
    if(f){r.lk.textContent=p?(p===f.w?"final · you ✓":"final · you ✗"):"final";if(p)r.lk.classList.add(p===f.w?"ok":"no");}
    else if(p){r.lk.textContent="your pick";r.lk.classList.add("mine");}
    else r.lk.textContent="";});
  document.querySelectorAll("[data-rec]").forEach(el=>{const c=el.dataset.rec,s=stat[c];el.textContent=s?`${s.w}-${s.l}`:(OPP_REC[c]||"");});
}

/* ---------- Live finals from ESPN's public scoreboard (same source as the hub's recap links) ---------- */
let liveNote="Showing results on file through Week 3.";
async function refreshFinals(){
  let ok=0,changed=false;const weeks=[];for(let w=1;w<=CUR_WK;w++)weeks.push(w);
  await Promise.all(weeks.map(async w=>{
    try{
      const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week=${w}`,{cache:"no-store"});
      if(!r.ok)return;const d=await r.json();ok++;
      (d.events||[]).forEach(ev=>{
        const c=ev.competitions&&ev.competitions[0],st=c&&c.status&&c.status.type;if(!st||!st.completed)return;
        const wk=(ev.week&&ev.week.number)||(d.week&&d.week.number)||w;
        const cs=c.competitors||[],H=cs.find(x=>x.homeAway==="home"),A=cs.find(x=>x.homeAway==="away");if(!H||!A)return;
        const ab=x=>{const v=((x.team&&x.team.abbreviation)||"").toUpperCase();return FROM_ESPN[v]||v;};
        const h=ab(H),a=ab(A),id=gid(wk,h,a);if(!id)return;
        const hs=parseInt(H.score,10),as=parseInt(A.score,10);if(isNaN(hs)||isNaN(as)||hs===as)return;
        const f=hs>as?{w:h,sc:`${h} ${hs}-${as} ${a}`}:{w:a,sc:`${a} ${as}-${hs} ${h}`};
        const o=FINAL[id];if(!o||o.w!==f.w||o.sc!==f.sc){FINAL[id]=f;changed=true;}});
    }catch(e){}}));
  liveNote=ok?"Final scores update automatically from ESPN.":"Live score update unavailable right now; showing results on file.";
  if(changed)render(true);else updateLegend();
}
function updateLegend(){document.getElementById("legend").innerHTML=
  `Tap a team's logo to pick the winner; tap it again to clear. Picks reset when the page reloads. Finished games lock with the real score and show whether your pick was right. `+
  `<b>DIV</b> = record vs AFC North, <b>GB</b> = games behind. Tiebreakers in order: <b>head-to-head › division › conference</b>. ★ = division game.<br>${liveNote}`;}

/* ---------- Opponents' real records: a loose guide, not affected by your picks ---------- */
const OPP_REC={ATL:"1-2",NE:"1-2",IND:"1-2",TB:"0-3",NO:"1-2",PHI:"2-1",DEN:"2-1",HOU:"0-3",JAX:"2-1",CAR:"1-2",
  TEN:"0-3",DAL:"1-2",BUF:"3-0",LAC:"0-3",WAS:"1-2",KC:"3-0",MIA:"0-3",NYJ:"1-2",LV:"3-0",NYG:"2-1"}; /* through Week 3 */
async function refreshOppRecords(){
  try{const r=await fetch("https://site.api.espn.com/apis/v2/sports/football/nfl/standings",{cache:"no-store"});if(!r.ok)return;
    const d=await r.json(),seen=new Set();
    const walk=o=>{if(!o||typeof o!=="object"||seen.has(o))return;seen.add(o);
      if(Array.isArray(o.entries))o.entries.forEach(e=>{const ab=((e.team&&e.team.abbreviation)||"").toUpperCase(),k=FROM_ESPN[ab]||ab,st={};
        (e.stats||[]).forEach(x=>{st[x.name]=x.value;});
        if(OPP[k]&&st.wins!=null&&st.losses!=null)OPP_REC[k]=st.wins+"-"+st.losses+(st.ties?"-"+st.ties:"");});
      Object.values(o).forEach(walk);};
    walk(d);refreshSched();}catch(e){}
}

/* ---------- Pick sound: tiny synthesized pop (no audio file); on/off remembered ---------- */
let AC=null,SOUND=true;
try{SOUND=localStorage.getItem("afcnSound")!=="off";}catch(e){}
function pop(up){if(!SOUND)return;try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type="sine";o.frequency.setValueAtTime(up?520:420,t);o.frequency.exponentialRampToValueAtTime(up?1150:170,t+0.07);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.32,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.13);}catch(e){}}
const bSnd=document.getElementById("bSnd");
function sndLabel(){bSnd.textContent="Sound: "+(SOUND?"on":"off");}
bSnd.onclick=()=>{SOUND=!SOUND;try{localStorage.setItem("afcnSound",SOUND?"on":"off");}catch(e){}sndLabel();pop(true);};
sndLabel();

async function refreshWhen(){let changed=false;
  const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/Denver",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
  await Promise.all(ORDER.map(async t=>{try{

    if(!r.ok)return;const d=await r.json();
    (d.events||[]).forEach(ev=>{const c=ev.competitions&&ev.competitions[0],wk=ev.week&&ev.week.number;if(!c||!wk||!ev.date)return;
      const cs=c.competitors||[];if(cs.length<2)return;

      const k=wkey(wk,ab(cs[0]),ab(cs[1]));if(!WHEN[k])return;
      const p={};fmt.formatToParts(new Date(ev.date)).forEach(x=>{p[x.type]=x.value;});

      const nv={m:+p.month,d:+p.day,t:tbd?"TBD":`${p.hour}:${p.minute}${p.dayPeriod==="AM"?"a":"p"}`};
